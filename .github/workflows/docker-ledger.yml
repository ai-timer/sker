name: Publish Sker Ledger Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push sker-ledger (native linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ai-timer/sker-ledger
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      # The Dockerfile builds the whole workspace (`COPY . .` + `cargo build -p sker-ledger`),
      # so the build context must be the repository root, not apps/sker-ledger.
      # ubuntu-latest is x86_64: linux/amd64 builds natively without QEMU emulation.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sker-ledger/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max