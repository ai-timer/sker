[package]
name = "sker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sker CLI: offline-first architectural rule engine and agent gate"
homepage.workspace = true
repository.workspace = true

[lib]
name = "sker"
path = "src/lib.rs"

[[bin]]
name = "sker"
path = "src/main.rs"

[dependencies]
sker-schema = { path = "../sker-schema" }
sker-compiler = { path = "../sker-compiler" }
sker-analyzer = { path = "../sker-analyzer" }
sker-retriever = { path = "../sker-retriever" }
sker-mcp = { path = "../sker-mcp" }
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
anyhow.workspace = true
blake3.workspace = true
ureq = { version = "3.5.2", features = ["json"] }
