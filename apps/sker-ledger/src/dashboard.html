<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sker Ledger</title>
<style>body{font:15px system-ui;max-width:980px;margin:40px auto;padding:0 18px;color:#202733;background:#f5f7fa}h1{font-size:26px}.row{display:flex;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #dfe5ec;border-radius:10px;padding:16px;flex:1;min-width:190px}button,select{padding:9px;border:1px solid #bbc5d1;border-radius:6px;background:white}table{width:100%;border-collapse:collapse;background:white;margin-top:18px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4e8ed}.muted{color:#687483}</style>
<h1>Sker Governance Ledger</h1><p class="muted">Read-only governance signals. Notices never change rule state.</p><select id="window"><option>7d</option><option selected>30d</option><option>90d</option></select> <button onclick="loadData()">Refresh</button><div class="row" id="cards"></div><h2>Rule health</h2><table><thead><tr><th>Rule</th><th>Status</th><th>Noise</th><th>Samples</th><th>Notice</th></tr></thead><tbody id="notices"></tbody></table>
<script>async function loadData(){let w=document.querySelector('#window').value;let [m,h]=await Promise.all([fetch('/api/v1/metrics/overview?window='+w),fetch('/api/v1/rules/health?window='+w)]);if(!m.ok||!h.ok){document.querySelector('#cards').innerHTML='<p>Ledger data unavailable.</p>';return}let a=await m.json(),b=await h.json();document.querySelector('#cards').innerHTML=a.metrics.map(x=>`<section class="card"><b>${x.key.replaceAll('_',' ')}</b><div style="font-size:24px;margin:8px 0">${x.value===null?'No data':x.unit==='distribution'?x.distribution.reduce((n,d)=>n+d.rule_count,0):Number(x.value).toLocaleString(undefined,{style:'percent',maximumFractionDigits:1})}</div><small>${x.numerator} / ${x.denominator} · ${x.sample_count} samples</small></section>`).join('');document.querySelector('#notices').innerHTML=b.notices.map(x=>`<tr><td>${x.rule_id}</td><td>${x.status}</td><td>${x.noise_rate===null?'—':(x.noise_rate*100).toFixed(1)+'%'}</td><td>${x.sample_count}</td><td>${x.message}</td></tr>`).join('')||'<tr><td colspan="5">No notices</td></tr>'}loadData()</script></html>
